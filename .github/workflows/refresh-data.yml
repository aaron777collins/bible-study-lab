name: Refresh data

on:
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Fetch sources, accepting changes
        run: npx tsx scripts/fetch.ts --update
      - run: npx tsx scripts/build-all.ts
      - run: npm run data:verify
      - name: Open a pull request with the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No data changes."
            exit 0
          fi
          branch="data-refresh-$(date +%Y%m%d)"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Refresh data from OpenBible.info and eBible"
          git push origin "$branch"
          rows=$(cat public/data/v1/xref/stats.json)
          gh pr create --title "Refresh data" --body "Monthly data refresh. Row counts: $rows. Review the diff of public/data/v1/xref/stats.json and scripts/sources.lock.json."
